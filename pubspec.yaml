name: dukaapp
description: "DukaApp - Smart Business Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Design
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  responsive_framework: ^1.5.1

  # Utilities
  intl: ^0.19.0
  flutter_animate: ^4.5.2
  path_provider: ^2.1.5
  open_file: ^3.5.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # File Parsing
  excel: ^4.0.6
  csv: ^6.0.0

  # PDF
  pdf: ^3.11.1

  # Camera & Media
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2

  # PDF Preview & Printing
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/submark_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/submark_logo.png"
  remove_alpha_ios: true
  padding: 0.25

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/logos/
    - assets/animations/
